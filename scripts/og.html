<!doctype html>
<!--
  Source of og.png, the 1200×630 share card. Regenerate from the repo root:
  "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new \
    --hide-scrollbars --allow-file-access-from-files --virtual-time-budget=4000 \
    --window-size=1200,630 --screenshot=og.png "file://$PWD/scripts/og.html"
-->
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Overpass:wght@600;800&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { background: #14202a; color: #f6f4ee; font-family: "Overpass", sans-serif; display: flex; align-items: center; gap: 48px; padding: 0 64px; box-sizing: border-box; }
  .post { width: 330px; flex: none; }
  .post text { font: 800 21px "Overpass", sans-serif; letter-spacing: .08em; }
  h1 { font-size: 64px; line-height: 1.02; margin: 0 0 14px; font-weight: 800; letter-spacing: -.02em; }
  p { font-size: 28px; margin: 0 0 32px; color: #c4ccd2; font-weight: 600; }
  .row { display: flex; gap: 12px; align-items: center; }
  .row div { background: #f6f4ee; border-radius: 12px; width: 100px; height: 100px; display: flex; align-items: center; justify-content: center; }
  .row img { max-width: 82px; max-height: 82px; }
</style>
</head>
<body>
  <svg class="post" viewBox="0 0 360 430">
    <rect x="170" y="14" width="20" height="404" rx="3" fill="#f6f4ee"/>
    <circle cx="180" cy="12" r="11" fill="#c8102e"/>
    <path d="M146 34h168l22 22-22 22H146z" fill="#006b3f" stroke="#fff" stroke-width="3"/><text x="236" y="64" text-anchor="middle" fill="#fff">ROAD</text>
    <path d="M214 94H46L24 116l22 22h168z" fill="#7a4a1f" stroke="#f3e3c3" stroke-width="3"/><text x="124" y="124" text-anchor="middle" fill="#f3e3c3">TRAIL</text>
    <path d="M146 154h168l22 22-22 22H146z" fill="#4a3426" stroke="#fff" stroke-width="3"/><text x="236" y="184" text-anchor="middle" fill="#fff">PARK</text>
    <path d="M214 214H46l-22 22 22 22h168z" fill="#111" stroke="#ffc72c" stroke-width="3"/><text x="124" y="244" text-anchor="middle" fill="#ffc72c">AIRPORT</text>
    <path d="M146 274h168l22 22-22 22H146z" fill="#c8102e" stroke="#fff" stroke-width="3"/><text x="236" y="304" text-anchor="middle" fill="#fff">SAFETY</text>
    <path d="M214 334H46l-22 22 22 22h168z" fill="#ffcd00" stroke="#111" stroke-width="3"/><text x="124" y="364" text-anchor="middle" fill="#111">RAILROAD</text>
  </svg>
  <div>
    <h1>Build-Signs.work</h1>
    <p>Free builders for road, trail, park, airport, safety and railroad signs.</p>
    <div class="row">
      <div><img src="../signs/road-stop.svg" alt=""></div>
      <div><img src="../signs/trail-forest-route.svg" alt=""></div>
      <div><img src="../signs/park-campsite.svg" alt=""></div>
      <div><img src="../signs/airport-location.svg" alt=""></div>
      <div><img src="../signs/safety-nfpa-704.svg" alt=""></div>
      <div><img src="../signs/railroad-advance.svg" alt=""></div>
    </div>
  </div>
</body>
</html>
